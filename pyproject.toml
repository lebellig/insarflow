[project]
name = "insarflow"
version = "0.1.0"
description = "Riemannian Flow Matching for InSAR Denoising and Generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "InSARFlow Contributors" }]
keywords = ["insar", "flow-matching", "riemannian", "diffusion", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "lightning>=2.5.1",
    "matplotlib>=3.9.4",
    "more-itertools>=10.7.0",
    "nibabel>=5.3.2",
    "pillow>=11.1.0",
    "pot>=0.9.5",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "tifffile>=2025.3.30",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchgeo>=0.7.0",
    "torchmetrics>=1.7.0",
    "torchvision>=0.21.0",
    "transformers[sentencepiece]>=4.52.4",
    "wandb>=0.19.9",
    "wandb-osh>=1.2.2",
    "tqdm>=4.0.0",
    "imagecodecs>=2026.3.6",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.11.2",
]

[project.scripts]
insarflow-train = "insarflow.train:main"
insarflow-inference = "insarflow.inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insarflow"]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "ruff>=0.11.2",
]

[tool.uv.sources]
# CUDA wheels on Linux/Windows; PyPI wheels (CPU on Linux/Windows, CPU+MPS on macOS)
# everywhere else, so `uv sync` works unchanged on a CPU-only machine.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
